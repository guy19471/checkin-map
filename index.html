<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🗺️ 行万里路</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--text2:#94a3b8;--accent:#f59e0b;--check:#10b981;--unvisited:#2d3748}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column}

/* Top bar */
.top-bar{display:flex;align-items:center;padding:8px 12px;gap:8px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.top-bar h1{font-size:1rem;font-weight:600;white-space:nowrap}
.tab-btn{padding:6px 14px;border-radius:20px;border:none;font-size:13px;cursor:pointer;background:transparent;color:var(--text2);transition:all .2s;white-space:nowrap}
.tab-btn.active{background:var(--accent);color:#000;font-weight:600}
.back-btn{padding:4px 10px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;margin-left:8px}

/* Main layout - desktop: side by side */
.main-layout{display:flex;flex:1;min-height:0;overflow:hidden}

/* Left sidebar */
.left-sidebar{width:280px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.stats-strip{display:flex;gap:4px;padding:8px;flex-shrink:0;overflow-x:auto;background:rgba(0,0,0,.2)}
.stat-chip{flex:1;min-width:60px;text-align:center;padding:5px 3px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-chip .num{font-size:1rem;font-weight:700;color:var(--accent)}
.stat-chip.visited .num{color:var(--check)}
.stat-chip .label{font-size:.6rem;color:var(--text2);display:block}

.panel-search{padding:6px 8px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;gap:4px}
.panel-search input{flex:1;padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.75rem;outline:none}
.panel-search select{padding:5px 6px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.7rem;max-width:80px;outline:none;cursor:pointer}

.item-list{flex:1;overflow-y:auto;padding:4px}
.item-list::-webkit-scrollbar{width:4px}
.item-list::-webkit-scrollbar-track{background:transparent}
.item-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.item-group{margin-bottom:6px}
.group-header{display:flex;align-items:center;padding:5px 8px;background:rgba(255,255,255,.03);border-radius:6px;font-size:.7rem;color:var(--text2);cursor:pointer;border:1px solid transparent;transition:all .15s}
.group-header.collapsed .toggle-icon{transform:rotate(-90deg)}
.group-name{flex:1;font-weight:500}
.group-count{font-size:.65rem;color:var(--accent);margin-right:4px}
.toggle-icon{font-size:.6rem;transition:transform .2s}
.group-items{padding:2px 0 2px 8px}
.item-row{display:flex;align-items:center;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:.75rem;transition:all .15s;gap:4px}
.item-row:hover{background:rgba(255,255,255,.05)}
.item-row.visited{background:rgba(16,185,129,.08)}
.item-row.enter-country{color:var(--accent)}
.item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:.6rem;color:var(--text2);flex-shrink:0}
.item-dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;background:transparent;color:#000}
.item-dot.checked{color:#fff}
.empty-hint{text-align:center;padding:30px;color:var(--text2);font-size:.8rem}

/* Right map area */
.right-area{flex:1;min-width:0;display:flex;flex-direction:column}
#chart{flex:1;min-height:0}

/* Country detail header */
.country-detail-header{display:none;align-items:center;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
.country-detail-header.show{display:flex}
.country-detail-header span{font-size:.8rem}

/* Legend */
.legend{text-align:center;padding:4px;font-size:.7rem;color:var(--text2);flex-shrink:0;background:var(--card);border-top:1px solid var(--border)}

/* Hint box */
#hint-box{position:fixed;bottom:10px;right:10px;background:rgba(15,23,42,.95);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:.8rem;color:var(--accent);pointer-events:none;z-index:50;opacity:0;transition:opacity .3s;max-width:200px}
#hint-box.show{opacity:1}

/* ==================== MODALS ==================== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:20px}
.modal h3{font-size:1rem;margin-bottom:14px;color:var(--accent)}
.modal h4{font-size:.85rem;margin:12px 0 8px;color:var(--text2)}
.modal pre{font-size:.75rem;background:var(--bg);padding:10px;border-radius:6px;overflow:auto;max-height:200px;white-space:pre-wrap;word-break:break-all}
.modal textarea{width:100%;height:120px;font-size:.75rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px;resize:vertical;font-family:inherit}
.modal input[type="text"],.modal input[type="number"]{width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.8rem;margin-bottom:8px}
.modal-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:7px 16px;border-radius:8px;border:none;font-size:.8rem;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--accent);color:#000;font-weight:600}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);font-size:.75rem;padding:5px 10px}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text2);cursor:pointer;font-size:1.2rem;line-height:1}
.modal{position:relative}

/* Color picker */
#color-picker{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.color-btn{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .2s}
.color-btn:hover{transform:scale(1.15)}
.color-btn.active{border-color:#fff}
#color-item-name{margin-bottom:8px;font-size:.9rem}

/* Image export */
.img-size-btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.img-size-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.75rem;cursor:pointer}
.img-size-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
#preview-canvas{max-width:100%;border-radius:6px;display:block;margin:10px auto;background:#0f172a}
#img-sub-hint{font-size:.7rem;color:var(--text2);text-align:center;margin-top:6px}

/* Share */
#share-link{width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.75rem;margin-bottom:8px}

/* ==================== PHOTO MODAL ==================== */
#photo-modal .modal{max-width:600px}
.photo-region-title{font-size:.85rem;color:var(--text2);margin-bottom:10px;padding:6px 10px;background:var(--bg);border-radius:6px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:10px 0;max-height:400px;overflow-y:auto}
.photo-thumb{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;cursor:pointer;border:1px solid var(--border);transition:transform .2s}
.photo-thumb:hover{transform:scale(1.03)}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb .photo-del{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.photo-add-btn{aspect-ratio:1;border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:2rem;color:var(--text2);transition:all .2s}
.photo-add-btn:hover{border-color:var(--accent);color:var(--accent)}
.photo-add-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo-empty{grid-column:1/-1;text-align:center;padding:30px;color:var(--text2);font-size:.8rem}
#photo-caption{margin:10px 0}
#photo-caption input{width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.8rem}

/* ==================== PHOTO VIEWER ==================== */
#photo-viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;align-items:center;justify-content:center;flex-direction:column}
#photo-viewer.show{display:flex}
#photo-viewer img{max-width:95vw;max-height:80vh;object-fit:contain;border-radius:8px}
#photo-viewer .pv-info{color:var(--text2);font-size:.8rem;margin-top:10px;text-align:center}
#photo-viewer .pv-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:10px 15px;border-radius:8px}
#photo-viewer .pv-prev{left:10px}
#photo-viewer .pv-next{right:10px}
#photo-viewer .pv-close{position:absolute;top:15px;right:20px;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer}
#photo-viewer .pv-counter{color:var(--text2);font-size:.8rem;margin-top:8px}

/* ==================== RIGHT CLICK MENU ==================== */
#ctx-menu{display:none;position:fixed;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 0;z-index:150;min-width:140px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ctx-item{padding:8px 14px;font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
.ctx-item:hover{background:rgba(255,255,255,.08)}
.ctx-item .ctx-icon{font-size:1rem}

/* ==================== MOBILE RESPONSIVE ==================== */
@media (max-width:640px){
  body{height:100dvh}
  .main-layout{flex-direction:column}
  .left-sidebar{width:100%;height:45%;border-right:none;border-bottom:1px solid var(--border);order:2}
  .right-area{height:55%;order:1}
  .right-area #chart{height:100%}
  .item-list{max-height:none;overflow-y:auto}
  .stats-strip{overflow-x:auto}
  .stat-chip{min-width:55px}
}

/* Landscape mobile: list on left */
@media (max-width:640px) and (orientation:landscape){
  body{height:100dvh}
  .main-layout{flex-direction:row}
  .left-sidebar{width:40%;height:100%;border-right:1px solid var(--border);border-bottom:none;order:1}
  .right-area{width:60%;height:100%;order:2}
  .right-area #chart{height:100%}
  .item-list{max-height:none;overflow-y:auto}
  .stats-strip{overflow-x:auto}
  .stat-chip{min-width:50px}
}
</style>
</head>
<body>

<!-- Top bar -->
<div class="top-bar">
  <button class="tab-btn active" data-tab="china" onclick="switchTab('china')">🇨🇳 中国</button>
  <button class="tab-btn" data-tab="world" onclick="switchTab('world')">🌍 世界</button>
  <button class="back-btn" id="back-btn" style="display:none" onclick="goBack()">← 返回</button>
  <h1 style="flex:1;text-align:right;font-size:.8rem;color:var(--text2)">🗺️ 行万里路</h1>
</div>

<!-- Country detail header -->
<div class="country-detail-header" id="country-detail-header">
  <span>📍</span>
  <span id="country-detail-name"></span>
  <span id="country-detail-count"></span>
</div>

<!-- Main layout -->
<div class="main-layout">
  <!-- Left sidebar -->
  <div class="left-sidebar">
    <div class="stats-strip" id="stats-strip"></div>
    <div class="panel-search">
      <input id="search-input" placeholder="搜索..." oninput="onSearch(this.value)">
      <select id="filter-select" onchange="onFilterChange(this.value)"><option value="all">全部</option></select>
    </div>
    <div class="item-list" id="item-list"></div>
  </div>
  <!-- Right map area -->
  <div class="right-area">
    <div id="chart"></div>
  </div>
</div>

<!-- Legend -->
<div class="legend" id="legend"></div>

<!-- Hint box -->
<div id="hint-box"></div>

<!-- ==================== MODALS ==================== -->

<!-- Color picker -->
<div class="modal-overlay" id="color-modal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3>🎨 选择颜色</h3>
      <button class="modal-close" onclick="closeModal('color-modal')">×</button>
    </div>
    <div id="color-item-name"></div>
    <div id="color-picker"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="applyColor()">确定</button>
      <button class="btn btn-secondary" onclick="closeModal('color-modal')">取消</button>
    </div>
  </div>
</div>

<!-- Image export -->
<div class="modal-overlay" id="img-export-modal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3>📸 生成分享图片</h3>
      <button class="modal-close" onclick="closeModal('img-export-modal')">×</button>
    </div>
    <div class="img-size-btns">
      <button class="img-size-btn active" data-size="S" onclick="setImgSize('S')">小</button>
      <button class="img-size-btn" data-size="M" onclick="setImgSize('M')">中</button>
      <button class="img-size-btn" data-size="L" onclick="setImgSize('L')">大</button>
      <button class="img-size-btn" data-size="XL" onclick="setImgSize('XL')">超大</button>
    </div>
    <select id="img-ratio-select" style="width:100%;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.75rem;margin-bottom:8px">
      <option value="16:9">16:9 横版</option>
      <option value="16:10" selected>16:10 横版</option>
      <option value="4:3">4:3 横版</option>
      <option value="1:1">1:1 方形</option>
    </select>
    <canvas id="preview-canvas"></canvas>
    <div id="img-sub-hint"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="downloadImage()">⬇️ 下载图片</button>
      <button class="btn btn-secondary" onclick="closeModal('img-export-modal')">关闭</button>
    </div>
  </div>
</div>

<!-- Share -->
<div class="modal-overlay" id="share-modal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3>🔗 分享链接</h3>
      <button class="modal-close" onclick="closeModal('share-modal')">×</button>
    </div>
    <p style="font-size:.75rem;color:var(--text2);margin-bottom:8px">复制链接，好友打开后自动导入你的打卡数据</p>
    <input id="share-link" readonly onclick="this.select()">
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="copyShare()">📋 复制链接</button>
      <button class="btn btn-secondary" onclick="closeModal('share-modal')">关闭</button>
    </div>
  </div>
</div>

<!-- Export -->
<div class="modal-overlay" id="export-modal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3>💾 导出数据</h3>
      <button class="modal-close" onclick="closeModal('export-modal')">×</button>
    </div>
    <textarea id="export-data" readonly onclick="this.select()"></textarea>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="copyExport()">📋 复制 JSON</button>
      <button class="btn btn-secondary" onclick="closeModal('export-modal')">关闭</button>
    </div>
  </div>
</div>

<!-- Import -->
<div class="modal-overlay" id="import-modal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3>📂 导入数据</h3>
      <button class="modal-close" onclick="closeModal('import-modal')">×</button>
    </div>
    <textarea id="import-data" placeholder="粘贴导出的 JSON 数据..."></textarea>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="doImport()">✅ 导入</button>
      <button class="btn btn-secondary" onclick="closeModal('import-modal')">取消</button>
    </div>
  </div>
</div>

<!-- Photo modal -->
<div class="modal-overlay" id="photo-modal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3>📷 打卡照片</h3>
      <button class="modal-close" onclick="closeModal('photo-modal')">×</button>
    </div>
    <div class="photo-region-title" id="photo-region-title"></div>
    <div class="photo-grid" id="photo-grid"></div>
    <div id="photo-caption"><input type="text" id="photo-caption-input" placeholder="添加描述（可选）..."></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="clearPhotos()">🗑️ 清除全部</button>
      <button class="btn btn-secondary" onclick="closeModal('photo-modal')">关闭</button>
    </div>
  </div>
</div>

<!-- Photo viewer -->
<div id="photo-viewer" onclick="closePhotoViewer()">
  <button class="pv-close" onclick="event.stopPropagation();closePhotoViewer()">×</button>
  <button class="pv-nav pv-prev" onclick="event.stopPropagation();showPrevPhoto()">‹</button>
  <img id="pv-img" onclick="event.stopPropagation()">
  <button class="pv-nav pv-next" onclick="event.stopPropagation();showNextPhoto()">›</button>
  <div id="pv-info" class="pv-info"></div>
  <div id="pv-counter" class="pv-counter"></div>
</div>

<!-- Context menu -->
<div id="ctx-menu">
  <div class="ctx-item" onclick="ctxChangeColor()"><span class="ctx-icon">🎨</span> 更换颜色</div>
  <div class="ctx-item" onclick="ctxAddPhoto()"><span class="ctx-icon">📷</span> 添加照片</div>
  <div class="ctx-item" onclick="ctxViewPhotos()"><span class="ctx-icon">🖼️</span> 查看照片</div>
  <div class="ctx-item" onclick="ctxUncheck()"><span class="ctx-icon">❌</span> 取消打卡</div>
</div>

<!-- Bottom toolbar -->
<div style="display:flex;gap:6px;padding:6px 12px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap">
  <button class="btn btn-ghost" onclick="showShare()">🔗 分享</button>
  <button class="btn btn-ghost" onclick="showExport()">💾 导出</button>
  <button class="btn btn-ghost" onclick="showImport()">📂 导入</button>
  <button class="btn btn-ghost" onclick="showImageExport()">📸 图片</button>
  <button class="btn btn-ghost" onclick="resetAll()">🔄 重置</button>
</div>

<script>
// ==================== CONFIG ====================
const STORAGE_KEY='checkin_map_v10';
const COLORS=['#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#10b981','#14b8a6','#06b6d4','#0ea5e9','#3b82f6','#6366f1','#8b5cf6','#a855f7','#d946ef','#ec4899','#f43f5e'];

// Province colors for China
const PROV_COLORS={'北京':'#ef4444','天津':'#f97316','河北':'#eab308','山西':'#84cc16','内蒙古':'#22c55e','辽宁':'#10b981','吉林':'#14b8a6','黑龙江':'#06b6d4','上海':'#0ea5e9','江苏':'#3b82f6','浙江':'#6366f1','安徽':'#8b5cf6','福建':'#a855f7','江西':'#d946ef','山东':'#ec4899','河南':'#f43f5e','湖北':'#ef4444','湖南':'#f97316','广东':'#f59e0b','广西':'#84cc16','海南':'#22c55e','重庆':'#10b981','四川':'#14b8a6','贵州':'#06b6d4','云南':'#0ea5e9','西藏':'#3b82f6','陕西':'#6366f1','甘肃':'#8b5cf6','青海':'#a855f7','宁夏':'#d946ef','新疆':'#ec4899','台湾':'#f43f5e'};
const CONTINENT_MAP={AS:'亚洲',EU:'欧洲',NA:'北美洲',SA:'南美洲',AF:'非洲',OC:'大洋洲',AN:'南极洲'};
const K_CONT_CH={AS:'亚洲',EU:'欧洲',NA:'北美洲',SA:'南美洲',AF:'非洲',OC:'大洋洲',AN:'南极洲'};

// Country regions with sub-divisions

  if(country==='Iran')return IRAN_PROVINCE_NAMES[name]||name;
  return name;
}

// ==================== INIT ====================
async function init(){
  loadData();
  initChart();
  loadGeoData();
  document.getElementById('search-input').value='';
  // Listen for resize/orientation changes on mobile
  window.addEventListener('resize',handleResize);
  window.addEventListener('orientationchange',handleResize);
}

function handleResize(){
  if(chart)setTimeout(()=>{chart.resize()},100);
}

// ==================== DATA ====================
function loadData(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved){
      const d=JSON.parse(saved);
      checkinData=d;
    }
  }catch(e){}
  // Load from URL hash
  try{
    const hash=location.hash;
    if(hash.includes('#data=')){
      const encoded=hash.split('#data=')[1];
      const d=JSON.parse(atob(encoded));
      if(d.china)checkinData.china={...checkinData.china,...d.china};
      if(d.world)checkinData.world={...checkinData.world,...d.world};
      if(d.worldSub)checkinData.worldSub={...checkinData.worldSub,...d.worldSub};
    }
  }catch(e){}
}

function saveData(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(checkinData))}catch(e){}
}

// ==================== CHART ====================
function initChart(){
  chart=echarts.init(document.getElementById('chart'));
  chart.on('click',onChartClick);
  chart.on('dblclick',onChartDblClick);
  // Global mouseover for world map hover highlight
  chart.getZr().on('mousemove',onGlobalMouseMove);
  chart.getZr().on('click',onGlobalClick);
  renderStats();renderFilterSelect();renderItemList();renderLegend();
}

function onGlobalMouseMove(params){
  if(!params.target)return;
  if(viewingCountry){
    // In country detail - let individual regions handle hover via ECharts emphasis
    return;
  }
  if(activeTab!=='world')return;
  // Show tooltip for world country under cursor
  const series=chart.getModel().getSeries()[0];
  if(!series)return;
  try{
    const dataIndex=chart.convertFromPixel({seriesIndex:0},[params.offsetX,params.offsetY])[2];
    if(dataIndex!=null&&dataIndex>=0){
      const data=series.getData().getItem(dataIndex);
      if(data&&data.name){
        chart.dispatchAction({type:'showTip',seriesIndex:0,dataIndex});
      }
    }
  }catch(e){}
}

function onGlobalClick(params){
  // No-op; click is handled by chart.on('click')
}

// ==================== GEO LOADING ====================
async function loadGeoData(){
  try{
    const [c,w,u]=await Promise.all([
      fetch(GEO_URLS.china).then(r=>r.json()),
      fetch(GEO_URLS.world).then(r=>r.json()),
      fetch(GEO_URLS.usStates).then(r=>r.json()).catch(()=>null)
    ]);
    chinaGeo=c;worldGeo=w;usStatesGeo=u;
    buildCityInfo();
    buildCountryInfo();
    try{echarts.registerMap('china_cities',chinaGeo)}catch(e){console.error('china reg err',e)}
    try{echarts.registerMap('world_countries',worldGeo)}catch(e){console.error('world reg err',e)}
    switchTab('china');
  }catch(e){console.error('geo load err',e);showToast('地图数据加载失败')}
}

function buildCityInfo(){
  if(!chinaGeo||!chinaGeo.features)return;
  chinaCityInfo=chinaGeo.features.map(f=>{
    const n=f.properties.name||'';
    const p=f.properties.parent||'';
    return{name:n,adcode:f.properties.adcode,province:p};
  }).filter(c=>c.adcode&&c.name);
}

function buildCountryInfo(){
  if(!worldGeo||!worldGeo.features)return;
  worldCountryInfo=worldGeo.features.map(f=>{
    const n=f.properties.name||f.properties.NAME||'';
    const r=f.properties.continent||f.properties.region||'Other';
    return{name:n,region:r};
  });
}

// ==================== CHART EVENTS ====================
function bindChartEvents(){
  // Already set in initChart
}

function onChartClick(params){
  if(!params.name)return;
  const name=params.name;
  
  if(viewingCountry){
    // In country detail: click on a region
    const key=viewingCountry+'|'+name;
    const color=checkinData.worldSub[key];
    showHint(name+(color?'':''));
    return;
  }
  
  if(activeTab==='world'){
    const ri=COUNTRY_REGIONS[name];
    if(ri){
      // Has sub-regions: show hint but don't auto-enter
      const cn=ri.name;
      showHint(`${cn}（${ri.count}个${ri.type}）— 双击进入详情`);
    } else {
      // No sub-regions: single click toggles checkin
      toggleItem(name,'world');
    }
  } else {
    // China: single click shows hint
    const info=chinaCityInfo.find(c=>c.name===name);
    if(info){
      const color=checkinData.china[info.adcode+''];
      showHint(`${info.name}（${info.province}）`);
    }
  }
}

function onChartDblClick(params){
  if(!params.name)return;
  const name=params.name;
  
  if(viewingCountry){
    // In country detail: double-click toggles checkin
    const c=countryDetailRegions.find(r=>r.name===name||r.cnName===name);
    if(c){
      if(activeTab==='world'){
        doWorldSubCheckin(viewingCountry,c.name,COLORS[0]);
      } else {
        doCheckin(c.adcode+'',COLORS[0]);
      }
    }
    return;
  }
  
  if(activeTab==='world'){
    const ri=COUNTRY_REGIONS[name];
    if(ri){
      enterCountryDetail(name);
    } else {
      toggleItem(name,'world');
    }
  } else {
    // China double-click to checkin
    const info=chinaCityInfo.find(c=>c.name===name);
    if(info){
      doCheckin(info.adcode+'',COLORS[0]);
      refreshAll();
    }
  }
}

function showHint(text){
  const hint=document.getElementById('hint-box');
  hint.textContent=text;
  hint.classList.add('show');
  clearTimeout(hint._timer);
  hint._timer=setTimeout(()=>hint.classList.remove('show'),3000);
}

// ==================== CHECKIN LOGIC ====================
function doCheckin(adcode,color){
  if(checkinData.china[adcode]){
    // Already checked in - show color picker
    showColorPicker(adcode,chinaCityInfo.find(c=>c.adcode+''===adcode)?.name||adcode,'china',checkinData.china[adcode]);
  } else {
    checkinData.china[adcode]=color||COLORS[0];
    saveData();
    showToast('✅ 打卡成功！');
    refreshAll();
  }
}

function doWorldCheckin(name,color){
  if(checkinData.world[name]){
    showColorPicker(name,name,'world',checkinData.world[name]);
  } else {
    checkinData.world[name]=color||COLORS[0];
    saveData();
    showToast('✅ 打卡成功！');
    refreshAll();
  }
}

function doWorldSubCheckin(country,name,color){
  const key=country+'|'+name;
  if(checkinData.worldSub[key]){
    const cn=getRegionChineseName(country,name);
    showColorPicker(name,cn,'worldSub',checkinData.worldSub[key]);
  } else {
    checkinData.worldSub[key]=color||COLORS[0];
    saveData();
    showToast('✅ 打卡成功！');
    refreshAll();
  }
}

  const prefix=countryName+'|';

  // Use real GeoJSON for US states if available

    regions=usStatesGeo.features.map(f=>f.properties.name).filter(Boolean);
    data=regions.map(name=>{
      const color=checkinData.worldSub[prefix+name];
      return{
        name,
        itemStyle:{areaColor:color||UNVISITED_COLOR,borderColor:'#1e293b',borderWidth:0.5},
        emphasis:{itemStyle:{areaColor:color||'#f59e0b',shadowBlur:8,shadowColor:color||'#f59e0b'}}
      };
    });
  } else if(countryName==='Iran'&&ri.regions){
    regions=ri.regions.map(name=>({name}));
    data=regions.map(r=>{
      const color=checkinData.worldSub[prefix+r.name];
      return{name:r.name,itemStyle:{areaColor:color||UNVISITED_COLOR,borderColor:'#1e293b',borderWidth:0.5},
        emphasis:{itemStyle:{areaColor:color||'#f59e0b',shadowBlur:8,shadowColor:color||'#f59e0b'}};
    });
  } else if(ri.regions){
    regions=ri.regions.map(name=>({name,cnName:getRegionChineseName(countryName,name)}));
    data=regions.map(r=>{
      const color=checkinData.worldSub[prefix+r.name];
      return{name:r.name,itemStyle:{areaColor:color||UNVISITED_COLOR,borderColor:'#1e293b',borderWidth:0.5},
        emphasis:{itemStyle:{areaColor:color||'#f59e0b',shadowBlur:8,shadowColor:color||'#f59e0b'}};

  } else {
    const count=ri.count||50;
    regions=Array.from({length:count},(_,i)=>({name:`${ri.type}${(i+1)}`}));
    data=regions.map(r=>{
      const color=checkinData.worldSub[prefix+r.name];
      return{name:r.name,itemStyle:{areaColor:color||UNVISITED_COLOR,borderColor:'#1e293b',borderWidth:0.5},

  // Build option - use real GeoJSON map if available

        textStyle:{color:'#e2e8f0',fontSize:12},
        formatter:p=>{
          const cn=getRegionChineseName(countryName,p.name);

        type:'map',
        map:'us_states_detail',
        roam:true,
        zoom,
        center,
        scaleLimit:{min:0.5,max:20},
        label:{show:false},
        itemStyle:{borderColor:'#1e293b',borderWidth:0.5},
        emphasis:{label:{show:true,fontSize:10,color:'#1a1a2e',fontWeight:'bold'}},
        data
      }]

  }

  return{
    backgroundColor:'#0f172a',
    tooltip:{
      trigger:'item',
      backgroundColor:'rgba(15,23,42,.95)',
      borderColor:'#334155',
      textStyle:{color:'#e2e8f0',fontSize:12},

// ==================== COUNTRY DETAIL ====================
function enterCountryDetail(countryName){
  const ri=COUNTRY_REGIONS[countryName];
  if(!ri){showToast('暂无详细数据');return;}

  viewingCountry=countryName;
  countryDetailRegions=[];

  if(ri.regions){
    countryDetailRegions=ri.regions.map(name=>({name,cnName:getRegionChineseName(countryName,name)}));
  } else {
    const count=ri.count||50;
    for(let i=1;i<=count;i++)countryDetailRegions.push({name:`${ri.type}${i}`,cnName:`${ri.type}${i}`});
  }

  document.getElementById('country-detail-name').textContent=ri.name;
  document.getElementById('country-detail-count').textContent=`${countryDetailRegions.length}个${ri.type}`;
  document.getElementById('country-detail-header').classList.add('show');
  document.getElementById('back-btn').style.display='inline';
  document.getElementById('hint-box').classList.remove('show');

  // Register map
  if(countryName==='United States of America'&&usStatesGeo){
    try{
      // Transform usStatesGeo to use state names as IDs
      const usGeo=JSON.parse(JSON.stringify(usStatesGeo));
      echarts.registerMap('us_states_detail',usGeo);
    }catch(e){console.error('US reg err',e)}
  } else if((countryName==='Iran')&&ri.regions){
    const geoData=generatePseudoGeoJSON(countryName,ri.regions);
    try{echarts.registerMap(countryName,geoData)}catch(e){console.error(e)}
  }

  chart.setOption(makeCountryDetailOption(countryName),true);
  renderStats();renderFilterSelect();renderItemList();renderLegend();
}

function generatePseudoGeoJSON(countryName,regions){
  let bounds={minX:0,maxX:0,minY:0,maxY:0};
  if(countryName==='United States of America'){
    bounds={minX:-125,maxX:-66,minY:24,maxY:50};
  } else if(countryName==='Iran'){
    bounds={minX:44,maxX:63,minY:25,maxY:40};
  }
  const cols=Math.ceil(Math.sqrt(regions.length));
  const features=regions.map((name,i)=>{
    const col=i%cols;
    const row=Math.floor(i/cols);
    const w=(bounds.maxX-bounds.minX)/cols;
    const h=(bounds.maxY-bounds.minY)/Math.ceil(regions.length/cols);
    const x1=bounds.minX+col*w;
    const y1=bounds.maxY-row*h;
    const x2=x1+w;
    const y2=y1-h;
    return{type:'Feature',properties:{name},geometry:{type:'Polygon',coordinates:[[[x1,y1],[x2,y1],[x2,y2],[x1,y2],[x1,y1]]]}};
  });
  return{type:'FeatureCollection',features};
}

// ==================== PHOTO FEATURE ====================
function getPhotoKey(name,tab,id,country){
  if(tab==='china')return'china:'+id;
  if(tab==='worldSub')return'worldSub:'+country+'|'+name;
  return'world:'+name;
}

function getPhotoRegionLabel(name,tab,country){
  if(tab==='china'){
    const c=chinaCityInfo.find(x=>x.name===name);
    return c?`${c.name}（${c.province}）`:name;
  }
  if(tab==='worldSub'){
    return getRegionChineseName(country,name);
  }
  return name;
}

function loadPhotos(key){
  try{
    const stored=localStorage.getItem('checkin_photos_'+key);
    return stored?JSON.parse(stored):[];
  }catch(e){return[];}
}

function savePhotos(key,photos){
  try{
    if(photos.length===0){
      localStorage.removeItem('checkin_photos_'+key);
    } else {
      localStorage.setItem('checkin_photos_'+key,JSON.stringify(photos));
    }
  }catch(e){showToast('存储空间不足，照片保存失败');}
}

let currentPhotoCtx={name:'',tab:'',id:'',country:''};

function openPhotoModal(name,tab,id,country){
  currentPhotoCtx={name,tab,id,country};
  const key=getPhotoKey(name,tab,id,country);
  const photos=loadPhotos(key);
  const label=getPhotoRegionLabel(name,tab,country);
  document.getElementById('photo-region-title').textContent='📍 '+label;
  document.getElementById('photo-caption-input').value='';
  renderPhotoGrid(key,photos);
  document.getElementById('photo-modal').classList.add('show');
}

function renderPhotoGrid(key,photos){
  const grid=document.getElementById('photo-grid');
  let html='';
  photos.forEach((p,i)=>{
    html+=`<div class="photo-thumb" onclick="openPhotoViewer('${key}',${i})">
      <img src="${p.data}" alt="photo">
      <button class="photo-del" onclick="event.stopPropagation();deletePhoto('${key}',${i})">×</button>
    </div>`;
  });
  // Add button
  html+=`<label class="photo-add-btn" onclick="event.stopPropagation()">
    +
    <input type="file" accept="image/*" multiple onchange="handlePhotoAdd(this.files)">
  </label>`;
  grid.innerHTML=html||'<div class="photo-empty">暂无照片，点击+添加</div>';
}

function handlePhotoAdd(files){
  const{name,tab,id,country}=currentPhotoCtx;
  const key=getPhotoKey(name,tab,id,country);
  const photos=loadPhotos(key);
  const maxSize=500; // max dimension in KB base64 estimate
  let added=0;
  Array.from(files).forEach(f=>{
    if(photos.length>=20){showToast('最多20张照片');return;}
    const reader=new FileReader();
    reader.onload=e=>{
      let data=e.target.result;
      // Compress if too large
      if(data.length>800*1024){
        data=compressImage(data,maxSize);
      }
      photos.push({data,date:new Date().toISOString(),caption:''});
      savePhotos(key,photos);
      renderPhotoGrid(key,photos);
      if(added===0)showToast(`已添加 ${files.length} 张照片`);
      added++;
    };
    reader.readAsDataURL(f);
  });
}

function compressImage(dataUrl,maxKB){
  const img=new Image();
  img.src=dataUrl;
  const c=document.createElement('canvas');
  const ratio=Math.sqrt(800/maxKB);
  c.width=img.width/ratio;
  c.height=img.height/ratio;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.7);
}

function deletePhoto(key,idx){
  const photos=loadPhotos(key);
  photos.splice(idx,1);
  savePhotos(key,photos);
  renderPhotoGrid(key,photos);
}

function clearPhotos(){
  const{name,tab,id,country}=currentPhotoCtx;
  const key=getPhotoKey(name,tab,id,country);
  if(!confirm('确定清除所有照片？'))return;
  savePhotos(key,[]);
  renderPhotoGrid(key,[]);
  showToast('已清除全部照片');
}

function openPhotoViewer(key,idx){
  const photos=loadPhotos(key);
  if(photos.length===0)return;
  photoViewerList=photos;
  photoViewerIdx=idx;
  showPhotoAtIdx();
  document.getElementById('photo-viewer').classList.add('show');
}

function showPhotoAtIdx(){
  const p=photoViewerList[photoViewerIdx];
  if(!p)return;
  document.getElementById('pv-img').src=p.data;
  document.getElementById('pv-info').textContent=p.caption||'';
  document.getElementById('pv-counter').textContent=`${photoViewerIdx+1} / ${photoViewerList.length}`;
  document.getElementById('pv-prev').style.display=photoViewerIdx>0?'flex':'none';
  document.getElementById('pv-next').style.display=photoViewerIdx<photoViewerList.length-1?'flex':'none';
}

function showPrevPhoto(){
  if(photoViewerIdx>0){photoViewerIdx--;showPhotoAtIdx();}
}
function showNextPhoto(){
  if(photoViewerIdx<photoViewerList.length-1){photoViewerIdx++;showPhotoAtIdx();}
}
function closePhotoViewer(){
  document.getElementById('photo-viewer').classList.remove('show');
}

const IMG_SIZES={S:{w:1280,h:800},M:{w:1920,h:1200},L:{w:2560,h:1600},XL:{w:3200,h:2000}};

function setImgSize(s){
  imgExportSize=s;
  document.querySelectorAll('.img-size-btn').forEach(b=>b.classList.toggle('active',b.dataset.size===s));
  generateHighResImage();

function generateHighResImage(){
  showToast('正在生成高清图片...');
  const size=IMG_SIZES[imgExportSize]||IMG_SIZES['M'];
  const ratio=document.getElementById('img-ratio-select').value;

  let canvasW=size.w;
  let canvasH=size.h;
  if(ratio==='16:10'){canvasW=size.w;canvasH=Math.round(size.w*10/16);}
  else if(ratio==='4:3'){canvasW=size.w;canvasH=Math.round(size.w*3/4);}
  else if(ratio==='1:1'){canvasW=Math.min(size.w,size.h);canvasH=canvasW;}

  const TITLE_H=70,STAT_H=36,LEGEND_H=36,FOOTER_H=30;
  const MAP_Y=TITLE_H+STAT_H;
  const MAP_H=canvasH-LEGEND_H-FOOTER_H-TITLE_H-STAT_H;

  const canvas=document.getElementById('preview-canvas');
  canvas.width=canvasW;canvas.height=canvasH;
  const ctx=canvas.getContext('2d');

  ctx.fillStyle='#0f172a';
  ctx.fillRect(0,0,canvasW,canvasH);

  ctx.fillStyle='#f59e0b';
  ctx.font=`bold ${Math.round(canvasW*0.04)}px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif`;
  ctx.textAlign='center';
  ctx.fillText('🗺️ 行万里路',canvasW/2,TITLE_H*0.65);

  ctx.font=`${Math.round(canvasW*0.018)}px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif`;
  ctx.textAlign='center';
  let statsText='';
  if(activeTab==='china'){
    const total=chinaCityInfo.length;
    const visited=Object.keys(checkinData.china).length;
    const pct=total>0?(visited/total*100).toFixed(1):'0';
    statsText=`中国 · ${visited}个城市已打卡 · ${pct}%覆盖率`;
  } else if(viewingCountry){
    const ri=COUNTRY_REGIONS[viewingCountry];
    const prefix=viewingCountry+'|';
    const visited=Object.keys(checkinData.worldSub).filter(k=>k.startsWith(prefix)).length;
    statsText=`${ri?ri.name:viewingCountry} · ${visited}个${ri?ri.type:''}已打卡`;
  } else {
    const total=worldCountryInfo.length;
    const visited=Object.keys(checkinData.world).length;
    const pct=total>0?(visited/total*100).toFixed(1):'0';
    statsText=`世界 · ${visited}个国家已打卡 · ${pct}%覆盖率`;
  }
  ctx.fillStyle='#94a3b8';
  ctx.fillText(statsText,canvasW/2,TITLE_H+STAT_H*0.7);

  const chartDataURL=chart.getDataURL({type:'png',pixelRatio:1,backgroundColor:'#0f172a'});
  const mapImg=new Image();
  mapImg.crossOrigin='anonymous';
  mapImg.onload=()=>{
    ctx.drawImage(mapImg,0,MAP_Y,canvasW,MAP_H);

    ctx.fillStyle='rgba(15,23,42,.88)';
    ctx.fillRect(0,canvasH-LEGEND_H-FOOTER_H,canvasW,LEGEND_H);
    ctx.strokeStyle='#334155';ctx.lineWidth=1;
    ctx.strokeRect(0,canvasH-LEGEND_H-FOOTER_H,canvasW,LEGEND_H);

    const legendY=canvasH-LEGEND_H/2-FOOTER_H+4;
    ctx.font=`${Math.round(canvasW*0.016)}px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif`;
    ctx.textAlign='center';
    if(activeTab==='china'){
      const visited=Object.keys(checkinData.china).length;
      ctx.fillStyle='#94a3b8';
      ctx.fillText(`🟩 已打卡: ${visited} / ${chinaCityInfo.length} 个城市`,canvasW/2,legendY);
    } else if(viewingCountry){
      const prefix=viewingCountry+'|';
      const visited=Object.keys(checkinData.worldSub).filter(k=>k.startsWith(prefix)).length;
      ctx.fillStyle='#94a3b8';
      ctx.fillText(`🟩 已打卡: ${visited} / ${countryDetailRegions.length}`,canvasW/2,legendY);
    } else {
      const visited=Object.keys(checkinData.world).length;
      ctx.fillStyle='#94a3b8';
      ctx.fillText(`🟩 已打卡: ${visited} / ${worldCountryInfo.length} 个国家`,canvasW/2,legendY);
    }

    ctx.fillStyle='#475569';
    ctx.font=`${Math.round(canvasW*0.013)}px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif`;
    ctx.textAlign='right';
    ctx.fillText('行万里路 · xingwanlilu.com',canvasW-15,canvasH-FOOTER_H+20);

    const mp=(canvasW*canvasH/1000000).toFixed(1);
    document.getElementById('img-sub-hint').textContent=`分辨率: ${canvasW} × ${canvasH}（约${mp}百万像素）`;
    showToast('图片已生成');
  };
  mapImg.onerror=()=>{
    ctx.fillStyle='#1a2a3a';ctx.fillRect(0,MAP_Y,canvasW,MAP_H);
    ctx.fillStyle='#64748b';
    ctx.font=`${Math.round(canvasW*0.03)}px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif`;
    ctx.textAlign='center';
    ctx.fillText('地图加载中，请刷新后重试',canvasW/2,MAP_Y+MAP_H/2);
    showToast('地图截图失败，显示占位图');
  };
  mapImg.src=chartDataURL;
}

function downloadImage(){
  const a=document.createElement('a');
  const dateStr=new Date().toISOString().slice(0,10);
  const sizeLabel={S:'小',M:'中',L:'大',XL:'超大'}[imgExportSize]||'中';
  const regionLabel=activeTab==='china'?'中国':viewingCountry?'detail':'世界';
  a.download=`行万里路_${regionLabel}_${sizeLabel}_${dateStr}.png`;
  a.href=document.getElementById('preview-canvas').toDataURL('image/png');
  a.click();
  showToast('图片已下载');
}

// ==================== SHARE/EXPORT/IMPORT ====================
function showShare(){
  const d={china:checkinData.china,world:checkinData.world,worldSub:checkinData.worldSub};
  const url=location.href.split('#')[0]+'#data='+btoa(JSON.stringify(d));
  document.getElementById('share-link').value=url;
  document.getElementById('share-modal').classList.add('show');
}
function copyShare(){
  const ta=document.getElementById('share-link');ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>showToast('已复制！')).catch(()=>{ta.select();document.execCommand('copy');showToast('已复制')});
}
function showExport(){
  const d={version:10,china:checkinData.china,world:checkinData.world,worldSub:checkinData.worldSub,exportedAt:new Date().toISOString()};
  document.getElementById('export-data').value=JSON.stringify(d,null,2);
  document.getElementById('export-modal').classList.add('show');
}
function copyExport(){
  const ta=document.getElementById('export-data');ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>showToast('已复制')).catch(()=>{ta.select();document.execCommand('copy');showToast('已复制')});
}
function showImport(){document.getElementById('import-modal').classList.add('show');document.getElementById('import-data').value=''}
function doImport(){
  try{
    const d=JSON.parse(document.getElementById('import-data').value);
    if(d.china)checkinData.china=d.china;
    if(d.world)checkinData.world=d.world;
    if(d.worldSub)checkinData.worldSub=d.worldSub;
    saveData();refreshAll();closeModal('import-modal');
    showToast('导入成功');
  }catch(e){showToast('JSON解析失败');}
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function resetAll(){if(!confirm('确定清除所有打卡记录？'))return;checkinData={china:{},world:{},worldSub:{}};saveData();refreshAll();showToast('已重置');}

// ==================== TOAST ====================
let toastTimer=null;
function showToast(msg){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}
  el.textContent=msg;
  el.style.cssText='position:fixed;top:50px;left:50%;transform:translateX(-50%);background:#1e293b;color:#e2e8f0;padding:8px 18px;border-radius:20px;z-index:200;font-size:.82rem;border:1px solid #334155;pointer-events:none;transition:opacity .3s;opacity:1';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.opacity='0';setTimeout(()=>{el.style.display='none'},300)},2000);
}

init();
</script>
