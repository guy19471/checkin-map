<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🗺️ 城市打卡地图</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--text2:#94a3b8;--accent:#f59e0b;--check:#10b981;--unvisited:#2d3748}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column}

/* Top bar */
.top-bar{display:flex;align-items:center;padding:8px 12px;gap:8px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.top-bar h1{font-size:1rem;font-weight:600;white-space:nowrap}
.tab-btn{padding:6px 14px;border-radius:20px;border:none;font-size:13px;cursor:pointer;background:transparent;color:var(--text2);transition:all .2s;white-space:nowrap}
.tab-btn.active{background:var(--accent);color:#000;font-weight:600}
.back-btn{padding:4px 10px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;margin-left:8px}

/* Main layout: left panel + map side by side */
.main-layout{display:flex;flex:1;min-height:0;overflow:hidden}

/* Left sidebar */
.left-sidebar{width:280px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.stats-strip{display:flex;gap:4px;padding:8px;flex-shrink:0;overflow-x:auto;background:rgba(0,0,0,.2)}
.stat-chip{flex:1;min-width:60px;text-align:center;padding:5px 3px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-chip .num{font-size:1rem;font-weight:700;color:var(--accent)}
.stat-chip.visited .num{color:var(--check)}
.stat-chip .label{font-size:.6rem;color:var(--text2);display:block}

/* Search and filter */
.panel-search{padding:6px 8px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;gap:4px}
.panel-search input{flex:1;padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.75rem;outline:none}
.panel-search select{padding:5px 6px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.7rem;max-width:80px;outline:none;cursor:pointer}

/* Item list */
.item-list{flex:1;overflow-y:auto;padding:4px}
.item-list::-webkit-scrollbar{width:4px}
.item-list::-webkit-scrollbar-track{background:transparent}
.item-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.item-group{margin-bottom:6px}
.group-header{display:flex;align-items:center;padding:5px 8px;background:rgba(255,255,255,.03);border-radius:6px;font-size:.7rem;color:var(--text2);cursor:pointer;border:1px solid transparent;transition:all .15s}
.group-header:hover{background:rgba(255,255,255,.06)}
.group-header .group-name{flex:1}
.group-header .group-count{color:var(--accent);font-weight:600}
.group-header .toggle-icon{font-size:.6rem;transition:transform .2s}
.group-header.collapsed .toggle-icon{transform:rotate(-90deg)}
.item-row{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 20px;margin:1px 0;border-radius:6px;cursor:pointer;font-size:.78rem;border:1px solid transparent;transition:all .15s}
.item-row:hover{background:rgba(255,255,255,.04);border-color:var(--border)}
.item-row.visited{background:rgba(16,185,129,.07);border-color:rgba(16,185,129,.2)}
.item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:.65rem;color:var(--text2);margin-left:4px}
.item-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .2s}
.item-dot.checked{border-color:var(--check);color:#fff}
.empty-hint{text-align:center;padding:30px;color:var(--text2);font-size:.8rem}

/* Footer buttons in sidebar */
.sidebar-footer{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.sidebar-footer button{flex:1;min-width:45%;padding:6px 0;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:.7rem;cursor:pointer;white-space:nowrap;transition:all .15s}
.sidebar-footer button:hover{background:rgba(255,255,255,.05)}
.sidebar-footer .btn-primary{background:var(--accent);color:#000;border:none;font-weight:600}

/* Map container */
#map-container{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
#map{width:100%;flex:1;min-height:0}
.legend{position:absolute;bottom:10px;left:10px;display:flex;gap:10px;background:rgba(15,23,42,.88);padding:5px 10px;border-radius:8px;font-size:.68rem;color:var(--text2);border:1px solid var(--border);pointer-events:none}

/* Hint box */
.hint-box{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);border-radius:8px;padding:6px 14px;font-size:.72rem;color:var(--accent);white-space:nowrap;display:none;z-index:5}
.hint-box.show{display:block}

/* Loading overlay */
.loading-overlay{position:absolute;inset:0;background:rgba(15,23,42,.9);display:none;align-items:center;justify-content:center;z-index:50}
.loading-overlay.show{display:flex}
.loading-text{color:var(--text);font-size:.9rem}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center;padding:10px}
.modal-overlay.show{display:flex}
.modal-content{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;border:1px solid var(--border)}
.modal-content h3{font-size:1rem;margin-bottom:8px}
.modal-content .hint{color:var(--text2);font-size:.7rem;margin-bottom:8px;display:block}
.modal-content textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.7rem;min-height:70px;resize:vertical;outline:none;word-break:break-all;font-family:inherit}
.modal-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.modal-actions button{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:.78rem;cursor:pointer}
.modal-actions .btn-primary{background:var(--accent);color:#000;border:none;font-weight:600}
.color-picker{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.color-btn{width:30px;height:30px;border-radius:6px;border:2px solid transparent;cursor:pointer;transition:all .2s}
.color-btn:hover,.color-btn.active{border-color:#fff;transform:scale(1.12)}
#preview-canvas{width:100%;border-radius:8px;margin-top:8px;background:#1a1a2e}

/* Country detail header */
.country-detail-header{display:none;align-items:center;padding:8px 12px;background:rgba(245,158,11,.1);border-bottom:1px solid rgba(245,158,11,.3);font-size:.8rem;color:var(--accent);flex-shrink:0}
.country-detail-header.show{display:flex;gap:6px}
.country-detail-header .close-btn{margin-left:auto;cursor:pointer;padding:2px 8px;border-radius:4px;border:1px solid var(--accent);font-size:.7rem}

/* Mobile responsive */
@media (max-width:640px){
  .left-sidebar{width:220px}
  .main-layout{flex-direction:column}
  .left-sidebar{width:100%;max-height:40vh;border-right:none;border-top:1px solid var(--border)}
  .item-list{max-height:25vh}
  #map{height:60vh}
}
</style>
</head>
<body>

<div class="top-bar">

</div>

</div>

<div class="main-layout">

  <div class="left-sidebar">

      <select id="filter-select" onchange="onFilterChange(this.value)"></select>
    </div>
    <div class="item-list" id="item-list"></div>
    <div class="sidebar-footer">
      <button onclick="resetAll()">🔄 重置</button>
      <button onclick="showShare()" class="btn-primary">🔗 分享</button>
      <button onclick="generateImage()">📸 图片</button>
      <button onclick="showExport()">💾 导出</button>
      <button onclick="showImport()">📥 导入</button>
    </div>
  </div>

  <!-- Map -->
  <div id="map-container">
    <div id="map"></div>
    <div class="hint-box" id="hint-box">💡 双击地图区域可快速打卡</div>
    <div class="legend" id="legend"></div>
    <div class="loading-overlay" id="loading"><div class="loading-text">📡 加载中...</div></div>
  </div>
</div>

<!-- Color picker modal -->
<div class="modal-overlay" id="color-modal">
  <div class="modal-content">
    <h3>🎨 选择打卡颜色</h3>
    <span class="hint">为 <b id="color-item-name"></b> 选择颜色</span>
    <div class="color-picker" id="color-picker"></div>
    <div class="modal-actions"><button onclick="closeModal('color-modal')">取消</button><button class="btn-primary" onclick="applyColor()">确定</button></div>
  </div>
</div>

<!-- Share modal -->
<div class="modal-overlay" id="share-modal">
  <div class="modal-content"><h3>🔗 分享链接</h3>
    <span class="hint">复制链接发给朋友</span>
    <textarea id="share-link" readonly></textarea>
    <div class="modal-actions"><button class="btn-primary" onclick="copyShare()">📋 复制</button><button onclick="closeModal('share-modal')">关闭</button></div>
  </div>
</div>

<!-- Export modal -->
<div class="modal-overlay" id="export-modal">
  <div class="modal-content"><h3>📤 导出数据</h3>
    <span class="hint">复制 JSON 数据，可导入到其他设备</span>
    <textarea id="export-data" readonly></textarea>
    <div class="modal-actions"><button class="btn-primary" onclick="copyExport()">📋 复制</button><button onclick="closeModal('export-modal')">关闭</button></div>
  </div>
</div>

<!-- Import modal -->
<div class="modal-overlay" id="import-modal">
  <div class="modal-content"><h3>📥 导入数据</h3>
    <span class="hint">粘贴之前导出的 JSON 数据</span>
    <textarea id="import-data" placeholder="在此粘贴 JSON..."></textarea>
    <div class="modal-actions"><button class="btn-primary" onclick="doImport()">确认导入</button><button onclick="closeModal('import-modal')">取消</button></div>
  </div>
</div>

<!-- Image modal -->
<div class="modal-overlay" id="image-modal">
  <div class="modal-content">
    <h3>📸 打卡地图图片</h3>
    <canvas id="preview-canvas"></canvas>
    <div class="modal-actions"><button class="btn-primary" onclick="downloadImage()">⬇️ 下载</button><button onclick="closeModal('image-modal')">关闭</button></div>
  </div>
</div>

// ==================== DATA LOADING ====================
function showLoading(show){document.getElementById('loading').classList.toggle('show',show)}

async function init(){
  showLoading(true);
  try{
    const [cRes,wRes]=await Promise.all([fetch(CHINA_JSON_URL),fetch(WORLD_JSON_URL)]);
    chinaGeo=await cRes.json();
    worldGeo=await wRes.json();

    chinaCityInfo=chinaGeo.features.map(f=>{
      const p=f.properties;
      return{name:p.name||'',province:p.province||'',adcode:p.adcode||'',level:p.level||''}
    }).filter(x=>x.name);

    worldCountryInfo=worldGeo.features.map(f=>{
      const p=f.properties;
      return{name:p.name||p.ADMIN||'',region:p.region||p.continent||''}
    }).filter(x=>x.name);

    chinaCityInfo.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));
    worldCountryInfo.sort((a,b)=>a.name.localeCompare(b.name,'en'));

    loadSaved();
    initChart();
    switchTab('china');
    showLoading(false);
    showToast('双击地图打卡 · 单击已打卡区域改颜色');
  }catch(e){
    showLoading(false);
    showToast('加载失败: '+e.message);
  }
}

function loadSaved(){
  try{
    const raw=localStorage.getItem(S_KEY);
    if(raw)checkinData=JSON.parse(raw);
  }catch(e){}
  try{
    const h=location.hash;
    if(h.startsWith('#data=')){
      const d=JSON.parse(atob(h.slice(6)));
      if(d.china)checkinData.china=d.china;
      if(d.world)checkinData.world=d.world;
      if(d.worldSub)checkinData.worldSub=d.worldSub;
      saveData();
    }
  }catch(e){}
}

function saveData(){
  try{
    localStorage.setItem(S_KEY,JSON.stringify(checkinData));
    const enc=btoa(JSON.stringify({china:checkinData.china,world:checkinData.world,worldSub:checkinData.worldSub}));
    if(enc.length<2000)history.replaceState(null,'','#data='+enc);
  }catch(e){}
}

let lastClickTime=0,lastClickId='',lastClickTab='';
function initChart(){
  chart=echarts.init(document.getElementById('map'));
  
  chart.on('click',params=>{
    if(params.componentType!=='series')return;
    const clickId=params.name||'';
    const now=Date.now();
    const isDbl=(clickId===lastClickId&&now-lastClickTime<400&&lastClickTab===activeTab);
    lastClickId=clickId;lastClickTime=now;lastClickTab=activeTab;
    
    if(isDbl){
      if(activeTab==='china'){
        const c=chinaCityInfo.find(x=>x.name===clickId);
        if(c)doCheckin(c.adcode+'');
      }else if(viewingCountry){
        doWorldSubCheckin(viewingCountry,clickId);
      }else{
        const ri=COUNTRY_REGIONS[clickId];
        if(ri&&!checkinData.world[clickId]&&ri.regions){
          enterCountryDetail(clickId);return;
        }
        doWorldCheckin(clickId);
      }
    }else{
      showItemInfo(clickId);
    }
  });
  
  // Mouse over for world sub-region highlight
  chart.on('mouseover',params=>{
    if(!viewingCountry||activeTab!=='world')return;
    const ri=COUNTRY_REGIONS[viewingCountry];
    if(!ri||!ri.regions)return;
    // Highlight the hovered sub-region
    const cnName=getRegionChineseName(viewingCountry,params.name);
    document.getElementById('hint-box').textContent=`📍 ${cnName}`;
    document.getElementById('hint-box').classList.add('show');
  });
  
  chart.on('mouseout',params=>{
    if(!viewingCountry)return;
    document.getElementById('hint-box').classList.remove('show');
  });
  
  window.addEventListener('resize',()=>{if(chart)chart.resize()});
}

function getRegionChineseName(country, regionName){
  if(country==='United States of America')return US_STATES_CN[regionName]||regionName;
  if(country==='Iran')return IRAN_PROVINCES_CN[regionName]||regionName;
  return regionName;
}

// ==================== CHECKIN LOGIC ====================
function doCheckin(id,color){
  color=color||COLORS[0];
  const info=chinaCityInfo.find(c=>c.adcode+''===id);
  if(checkinData.china[id]){
    delete checkinData.china[id];
    showToast('取消打卡: '+(info?info.name:id));
  }else{
    checkinData.china[id]=color;
    showToast('\u{1F389} 打卡: '+(info?info.name:id));
  }
  saveData();refreshAll();
}

function doWorldCheckin(name,color){
  color=color||COLORS[0];
  if(checkinData.world[name]){
    delete checkinData.world[name];
    showToast('取消: '+name);
  }else{
    checkinData.world[name]=color;
    showToast('\u{1F389} 打卡: '+name);
  }
  saveData();refreshAll();
}

function doWorldSubCheckin(country,name,color){
  color=color||COLORS[0];
  const key=country+'|'+name;
  if(checkinData.worldSub[key]){
    delete checkinData.worldSub[key];
    showToast('取消: '+getRegionChineseName(country,name));
  }else{
    checkinData.worldSub[key]=color;
    showToast('\u{1F389} 打卡: '+getRegionChineseName(country,name));
  }
  saveData();refreshAll();
}

function showItemInfo(clickId){
  if(activeTab==='china'){
    const info=chinaCityInfo.find(c=>c.name===clickId);
    if(!info)return;
    const color=checkinData.china[info.adcode+''];
    if(color){showColorPicker(info.adcode+'',info.name,'china',color)}
    else{
      document.getElementById('hint-text').textContent=`${info.name}（${info.province}）- 双击打卡`;
      document.getElementById('hint-box').classList.add('show');
    }
  }else if(viewingCountry){
    const ri=COUNTRY_REGIONS[viewingCountry];
    const cnName=getRegionChineseName(viewingCountry,clickId);
    const key=viewingCountry+'|'+clickId;
    if(checkinData.worldSub[key]){showColorPicker(clickId,cnName,'worldSub',checkinData.worldSub[key])}
    else{
      document.getElementById('hint-box').textContent=`📍 ${cnName} — 双击打卡`;
      document.getElementById('hint-box').classList.add('show');
    }
  }else{
    const info=worldCountryInfo.find(c=>c.name===clickId);
    if(!info)return;
    const ri=COUNTRY_REGIONS[clickId];
    const color=checkinData.world[clickId];
    if(color){showColorPicker(clickId,info.name,'world',color)}
    else{
      let t=`${info.name}`;
      if(ri)t+=`（${ri.count}个${ri.type}）`;
      document.getElementById('hint-box').textContent=t;
      document.getElementById('hint-box').classList.add('show');
    }
  }
}

function makeCountryDetailOption(countryName){
  const ri=COUNTRY_REGIONS[countryName];
  if(!ri)return{};
  
  let data=[],regions=[];
  
  if(countryName==='United States of America'&&ri.regions){
    // US states with full data
    regions=ri.regions.map((name,i)=>({name,index:i}));
    data=regions.map(r=>{
      const color=checkinData.worldSub[countryName+'|'+r.name];
      return{name:r.name,itemStyle:{areaColor:color||UNVISITED_COLOR,borderColor:'#1e293b',borderWidth:0.5},
        emphasis:{itemStyle:{areaColor:color||'#f59e0b',shadowBlur:8,shadowColor:color||'#f59e0b'}}}
    });
  }else if(countryName==='Iran'&&ri.regions){
    regions=ri.regions.map(name=>({name}));
    data=regions.map(r=>{
      const color=checkinData.worldSub[countryName+'|'+r.name];
      return{name:r.name,itemStyle:{areaColor:color||UNVISITED_COLOR,borderColor:'#1e293b',borderWidth:0.5},
        emphasis:{itemStyle:{areaColor:color||'#f59e0b',shadowBlur:8,shadowColor:color||'#f59e0b'}}}
    });
  }else{
    // Generic regions
    const count=ri.count||50;
    regions=Array.from({length:count},(_,i)=>({name:`${ri.type}${(i+1)}`}));
    data=regions.map(r=>{
      const color=checkinData.worldSub[countryName+'|'+r.name];
      return{name:r.name,itemStyle:{areaColor:color||UNVISITED_COLOR,borderColor:'#1e293b',borderWidth:0.5},
        emphasis:{itemStyle:{areaColor:color||'#f59e0b',shadowBlur:8}}}
    });
  }
  
  // Get center coordinates from world map data for the country
  let center=[0,0];
  const countryInfo=worldCountryInfo.find(c=>c.name===countryName);
  if(countryName==='United States of America')center=[-98.5,39.8];
  else if(countryName==='Iran')center=[53.7,32.4];
  else if(countryInfo){
    // Try to get center from geo data
  }
  
  return{
    backgroundColor:'#0f172a',
    tooltip:{
      trigger:'item',
      backgroundColor:'rgba(15,23,42,.95)',
      borderColor:'#334155',
      textStyle:{color:'#e2e8f0',fontSize:12},
      formatter:p=>{
        const cn=getRegionChineseName(countryName,p.name);
        const key=countryName+'|'+p.name;
        const color=checkinData.worldSub[key];
        return`<div><b>${cn}</b><br><span style="color:${color||'#f59e0b'}">${color?'✅ 已打卡':'⭕ 未打卡'}</span></div>`;
      }
    },
    series:[{
      type:'map',
      map:countryName,
      roam:true,
      zoom:1,
      center:center,
      scaleLimit:{min:0.5,max:20},
      label:{show:false},
      itemStyle:{borderColor:'#1e293b',borderWidth:0.5},
      emphasis:{label:{show:true,fontSize:10,color:'#1a1a2e',fontWeight:'bold'}},
      data
    }]
  };
}

// ==================== COUNTRY DETAIL ====================
let countryDetailRegions=[];
function enterCountryDetail(countryName){
  const ri=COUNTRY_REGIONS[countryName];
  if(!ri){showToast('暂无详细数据');return;}
  
  viewingCountry=countryName;
  countryDetailRegions=[];
  
  if(ri.regions){
    countryDetailRegions=ri.regions.map(name=>({name,cnName:getRegionChineseName(countryName,name)}));
  }else{
    const count=ri.count||50;
    for(let i=1;i<=count;i++)countryDetailRegions.push({name:`${ri.type}${i}`,cnName:`${ri.type}${i}`});
  }
  
  document.getElementById('country-detail-name').textContent=ri.name;
  document.getElementById('country-detail-count').textContent=`${countryDetailRegions.length}个${ri.type}`;
  document.getElementById('country-detail-header').classList.add('show');
  
  renderCountryDetailMap(countryName,ri);
  renderStats();
  renderFilterSelect();
  renderItemList();
}

function renderCountryDetailMap(countryName,ri){
  if((countryName==='United States of America'||countryName==='Iran')&&ri.regions){
    // Generate pseudo-GeoJSON for US/Iran from list of regions
    const geoData=generatePseudoGeoJSON(countryName,ri.regions);
    try{echarts.registerMap(countryName,geoData)}catch(e){console.error(e)}
    chart.setOption(makeCountryDetailOption(countryName),true);
  }else{
    // Show as chart without map
    chart.clear();
    chart.setOption({
      backgroundColor:'#0f172a',
      tooltip:{trigger:'axis',axisPointer:{type:'shadow'},
        backgroundColor:'rgba(15,23,42,.95)',borderColor:'#334155',textStyle:{color:'#e2e8f0'}},
      grid:{left:10,right:10,top:10,bottom:30,containLabel:true},
      xAxis:{type:'category',data:countryDetailRegions.map(r=>r.cnName||r.name),axisLabel:{color:'#94a3b8',fontSize:10,rotate:45,interval:0},axisLine:{lineStyle:{color:'#334155'}}},
      yAxis:{type:'value',axisLabel:{color:'#94a3b8',fontSize:10},splitLine:{lineStyle:{color:'#1e293b'}},axisLine:{lineStyle:{color:'#334155'}}},
      series:[{
        type:'bar',
        data:countryDetailRegions.map(r=>{
          const color=checkinData.worldSub[countryName+'|'+r.name];
          return{value:1,name:r.cnName||r.name,itemStyle:{color:color||UNVISITED_COLOR,borderRadius:[4,4,0,0]}};
        }),
        label:{show:true,fontSize:9,color:'#fff',position:'top',formatter:p=>{
          const color=checkinData.worldSub[countryName+'|'+p.name];
          return color?'✓':'';
        }},
        itemStyle:{borderRadius:[4,4,0,0]},
        emphasis:{itemStyle:{color:'#f59e0b'}}
      }]
    });
  }
}

function generatePseudoGeoJSON(countryName,regions){
  // Create a simple bounding box for the country
  let bounds={minX:0,maxX:0,minY:0,maxY:0};
  if(countryName==='United States of America'){
    bounds={minX:-125,maxX:-66,minY:24,maxY:50};
  }else if(countryName==='Iran'){
    bounds={minX:44,maxX:63,minY:25,maxY:40};
  }
  const cols=Math.ceil(Math.sqrt(regions.length));
  const features=regions.map((name,i)=>{
    const col=i%cols;
    const row=Math.floor(i/cols);
    const w=(bounds.maxX-bounds.minX)/cols;
    const h=(bounds.maxY-bounds.minY)/cols;
    const x1=bounds.minX+col*w;
    const y1=bounds.maxY-row*h;
    const x2=x1+w;
    const y2=y1-h;
    return{type:'Feature',properties:{name},geometry:{type:'Polygon',coordinates:[[[x1,y1],[x2,y1],[x2,y2],[x1,y2],[x1,y1]]]}};
  });
  return{type:'FeatureCollection',features};
}

function goBack(){
  viewingCountry=null;
  countryDetailRegions=[];
  document.getElementById('country-detail-header').classList.remove('show');
  document.getElementById('hint-box').classList.remove('show');
  document.getElementById('map').innerHTML='';
  initChart();
  echarts.registerMap('china_cities',chinaGeo);
  echarts.registerMap('world_countries',worldGeo);
  if(activeTab==='china')chart.setOption(makeChinaOption(),true);
  else chart.setOption(makeWorldOption(),true);
  renderStats();renderFilterSelect();renderItemList();renderLegend();
}

// ==================== TAB SWITCHING ====================
function switchTab(tab){
  if(viewingCountry)goBack();
  activeTab=tab;searchQuery='';filterValue='all';
  document.getElementById('search-input').value='';
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  if(!chart||!chinaGeo||!worldGeo)return;
  echarts.registerMap('china_cities',chinaGeo);
  echarts.registerMap('world_countries',worldGeo);
  if(tab==='china')chart.setOption(makeChinaOption(),true);
  else chart.setOption(makeWorldOption(),true);
  renderStats();renderFilterSelect();renderItemList();renderLegend();
  document.getElementById('hint-box').classList.remove('show');
}

// ==================== TOGGLE ITEMS ====================
function toggleItem(name,tab){
  if(tab==='china'){
    const c=chinaCityInfo.find(x=>x.name===name);
    if(c)doCheckin(c.adcode+'',COLORS[0]);
  }else if(viewingCountry){
    doWorldSubCheckin(viewingCountry,name,COLORS[0]);
  }else{
    const ri=COUNTRY_REGIONS[name];
    if(ri&&!checkinData.world[name]&&ri.regions){
      enterCountryDetail(name);return;
    }
    doWorldCheckin(name,COLORS[0]);
  }
}

// ==================== RENDER ====================
function renderStats(){
  let html='';
  if(activeTab==='china'){
    const total=chinaCityInfo.length;
    const visited=Object.keys(checkinData.china).length;
    const pct=total>0?(visited/total*100).toFixed(1):'0';
    const provs=new Set(chinaCityInfo.filter(c=>checkinData.china[c.adcode+'']).map(c=>c.province));
    html=`<div class="stat-chip visited"><span class="num">${visited}</span><span class="label">已打卡</span></div>
          <div class="stat-chip"><span class="num">${total}</span><span class="label">城市</span></div>
          <div class="stat-chip"><span class="num">${provs.size}</span><span class="label">省份</span></div>
          <div class="stat-chip"><span class="num">${pct}%</span><span class="label">覆盖</span></div>`;
  }else if(viewingCountry){
    const ri=COUNTRY_REGIONS[viewingCountry];
    const prefix=viewingCountry+'|';
    const visited=Object.keys(checkinData.worldSub).filter(k=>k.startsWith(prefix)).length;
    const total=countryDetailRegions.length;
    html=`<div class="stat-chip visited"><span class="num">${visited}</span><span class="label">已打卡</span></div>
          <div class="stat-chip"><span class="num">${total}</span><span class="label">${ri?ri.type:''}</span></div>`;
  }else{
    const total=worldCountryInfo.length;
    const visited=Object.keys(checkinData.world).length;
    const pct=total>0?(visited/total*100).toFixed(1):'0';
    html=`<div class="stat-chip visited"><span class="num">${visited}</span><span class="label">已打卡</span></div>
          <div class="stat-chip"><span class="num">${total}</span><span class="label">国家</span></div>
          <div class="stat-chip"><span class="num">${pct}%</span><span class="label">覆盖</span></div>`;
  }
  document.getElementById('stats-strip').innerHTML=html;
}

function renderFilterSelect(){
  const sel=document.getElementById('filter-select');
  sel.value=filterValue;
  if(activeTab==='china'){
    const provs=[...new Set(chinaCityInfo.map(c=>c.province))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
    sel.innerHTML='<option value="all">全部省份</option>'+provs.map(p=>`<option value="${p}">${p}</option>`).join('');
  }else if(viewingCountry){
    sel.innerHTML='<option value="all">全部</option>';
  }else{
    const conts=[...new Set(worldCountryInfo.map(c=>c.region))].sort();
    sel.innerHTML='<option value="all">全部大洲</option>'+conts.map(r=>`<option value="${r}">${K_CONT_CH[r]||r}</option>`).join('');
  }
}

function renderItemList(){
  const el=document.getElementById('item-list');
  let items=[];
  
  if(activeTab==='china'){
    // Group by province
    const grouped={};
    for(const c of chinaCityInfo){
      if(filterValue!=='all'&&c.province!==filterValue)continue;
      if(searchQuery&&!c.name.includes(searchQuery)&&!c.province.includes(searchQuery))continue;
      if(!grouped[c.province])grouped[c.province]=[];
      grouped[c.province].push(c);
    }
    let html='';
    for(const [province,cities] of Object.entries(grouped)){
      const visited=cities.filter(c=>checkinData.china[c.adcode+'']).length;
      const total=cities.length;
      html+=`<div class="item-group"><div class="group-header" onclick="toggleGroup(this)">
        <span class="group-name">${province}</span><span class="group-count">${visited}/${total}</span><span class="toggle-icon">▼</span></div>
        <div class="group-items">${cities.map(c=>makeItemRow(c.name,'china',checkinData.china[c.adcode+''],c.province)).join('')}</div></div>`;
    }
    el.innerHTML=html||'<div class="empty-hint">无匹配项</div>';
  }else if(viewingCountry){
    // Country sub-regions
    const ri=COUNTRY_REGIONS[viewingCountry];
    let filtered=countryDetailRegions;
    if(searchQuery){
      filtered=filtered.filter(r=>{
        const cn=r.cnName||r.name;
        return cn.includes(searchQuery)||r.name.toLowerCase().includes(searchQuery.toLowerCase());
      });
    }
    const visited=filtered.filter(r=>checkinData.worldSub[viewingCountry+'|'+r.name]).length;
    el.innerHTML=`<div class="item-group"><div class="group-header">
        <span class="group-name">${ri?ri.name:viewingCountry}</span>
        <span class="group-count">${visited}/${filtered.length}</span></div></div>
      ${filtered.map(r=>makeWorldSubRow(r.name,viewingCountry,checkinData.worldSub[viewingCountry+'|'+r.name])).join('')}`||'<div class="empty-hint">无匹配项</div>';
  }else{
    // World countries grouped by continent
    const grouped={};
    for(const c of worldCountryInfo){
      if(filterValue!=='all'&&c.region!==filterValue)continue;
      if(searchQuery&&!c.name.toLowerCase().includes(searchQuery.toLowerCase()))continue;
      const r=c.region||'Other';
      if(!grouped[r])grouped[r]=[];
      grouped[r].push(c);
    }
    let html='';
    for(const [region,cntries] of Object.entries(grouped)){
      const cn=K_CONT_CH[region]||region;
      const visited=cntries.filter(c=>checkinData.world[c.name]).length;
      html+=`<div class="item-group"><div class="group-header" onclick="toggleGroup(this)">
        <span class="group-name">${cn}</span><span class="group-count">${visited}/${cntries.length}</span><span class="toggle-icon">▼</span></div>
        <div class="group-items">${cntries.map(c=>makeItemRow(c.name,'world',checkinData.world[c.name],null,COUNTRY_REGIONS[c.name])).join('')}</div></div>`;
    }
    el.innerHTML=html||'<div class="empty-hint">无匹配项</div>';
  }
}

function makeItemRow(name,tab,color,sub,ri){
  const checked=!!color;
  let subText=sub||'';
  if(ri)subText=`${ri.count}个${ri.type}`;
  const cnName=name;
  return`<div class="item-row${checked?' visited':''}" onclick="toggleItem('${name.replace(/'/g,"\\'")}','${tab}')">
    <span class="item-name">${cnName}</span>${subText?`<span class="item-sub">${subText}</span>`:''}
    <span class="item-dot${checked?' checked':''}" ${color?`style="background:${color};border-color:${color}"`:''}>${checked?'✓':''}</span></div>`;
}

function makeWorldSubRow(name,country,color){
  const checked=!!color;
  const cn=getRegionChineseName(country,name);
  return`<div class="item-row${checked?' visited':''}" onclick="toggleItem('${name.replace(/'/g,"\\'")}','worldSub')">
    <span class="item-name">${cn}</span>
    <span class="item-dot${checked?' checked':''}" ${color?`style="background:${color};border-color:${color}"`:''}>${checked?'✓':''}</span></div>`;
}

function toggleGroup(header){
  const items=header.nextElementSibling;
  const isCollapsed=header.classList.toggle('collapsed');
  items.style.display=isCollapsed?'none':'block';
}

function renderLegend(){
  const legend=document.getElementById('legend');
  if(viewingCountry){
    const ri=COUNTRY_REGIONS[viewingCountry];
    legend.innerHTML=`<span>🟩 已打卡</span><span>⬜ 未打卡</span>`;
  }else{
    legend.innerHTML=`<span>🟩 已打卡</span><span>⬜ 未打卡</span><span style="color:#f59e0b">双击打卡</span>`;
  }
}

function refreshAll(){
  if(activeTab==='china'&&!viewingCountry)chart.setOption(makeChinaOption(),true);
  else if(activeTab==='world'&&!viewingCountry)chart.setOption(makeWorldOption(),true);
  renderStats();renderFilterSelect();renderItemList();renderLegend();
}

// ==================== SEARCH & FILTER ====================
function onSearch(val){searchQuery=val;renderItemList()}
function onFilterChange(val){filterValue=val;renderItemList()}

// ==================== COLOR PICKER ====================
let colorPickerTarget={id:'',type:'',current:''};
function showColorPicker(id,name,type,currentColor){
  colorPickerTarget={id,type,current:currentColor||COLORS[0]};
  document.getElementById('color-item-name').textContent=name;
  document.getElementById('color-picker').innerHTML=COLORS.map(c=>{
    const active=c===colorPickerTarget.current?'active':'';
    return`<div class="color-btn ${active}" style="background:${c}" onclick="selectColor('${c}')"></div>`;
  }).join('');
  document.getElementById('color-modal').classList.add('show');
}
function selectColor(c){
  document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.color-btn[style*="${c}"]`)?.classList.add('active');
  colorPickerTarget.current=c;
}
function applyColor(){
  const{id,type,current}=colorPickerTarget;
  if(type==='china')checkinData.china[id]=current;
  else if(type==='world')checkinData.world[id]=current;
  else if(type==='worldSub')checkinData.worldSub[viewingCountry+'|'+id]=current;
  saveData();closeModal('color-modal');refreshAll();showToast('🎨 颜色已更新');
}

// ==================== IMAGE ====================
function generateImage(){
  showToast('生成图片...');
  setTimeout(()=>{
    try{
      const url=chart.getDataURL({type:'png',pixelRatio:2,backgroundColor:'#0f172a'});
      const canvas=document.getElementById('preview-canvas');
      const ctx=canvas.getContext('2d');
      const img=new Image();img.crossOrigin='anonymous';
      img.onload=()=>{
        canvas.width=img.width;canvas.height=img.height;
        ctx.drawImage(img,0,0);
        ctx.fillStyle='rgba(255,255,255,.4)';
        ctx.font='14px sans-serif';
        ctx.textAlign='right';
        ctx.fillText('城市打卡地图',canvas.width-15,canvas.height-15);
        document.getElementById('image-modal').classList.add('show');
        showToast('图片已生成');
      };
      img.onerror=()=>showToast('图片加载失败');
      img.src=url;
    }catch(e){showToast('生成失败');}
  },100);
}
function downloadImage(){
  const a=document.createElement('a');
  a.download=`打卡地图_${new Date().toISOString().slice(0,10)}.png`;
  a.href=document.getElementById('preview-canvas').toDataURL('image/png');
  a.click();
  showToast('已下载');
}

// ==================== SHARE/EXPORT/IMPORT ====================
function showShare(){
  const d={china:checkinData.china,world:checkinData.world,worldSub:checkinData.worldSub};
  const url=location.href.split('#')[0]+'#data='+btoa(JSON.stringify(d));
  document.getElementById('share-link').value=url;
  document.getElementById('share-modal').classList.add('show');
}
function copyShare(){
  const ta=document.getElementById('share-link');ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>showToast('已复制！')).catch(()=>{ta.select();document.execCommand('copy');showToast('已复制')});
}
function showExport(){
  const d={version:8,china:checkinData.china,world:checkinData.world,worldSub:checkinData.worldSub,exportedAt:new Date().toISOString()};
  document.getElementById('export-data').value=JSON.stringify(d,null,2);
  document.getElementById('export-modal').classList.add('show');
}
function copyExport(){
  const ta=document.getElementById('export-data');ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>showToast('已复制')).catch(()=>{ta.select();document.execCommand('copy');showToast('已复制')});
}
function showImport(){document.getElementById('import-modal').classList.add('show');document.getElementById('import-data').value=''}
function doImport(){
  try{
    const d=JSON.parse(document.getElementById('import-data').value);
    if(d.china)checkinData.china=d.china;
    if(d.world)checkinData.world=d.world;
    if(d.worldSub)checkinData.worldSub=d.worldSub;
    saveData();refreshAll();closeModal('import-modal');
    showToast('导入成功');
  }catch(e){showToast('JSON解析失败');}
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function resetAll(){if(!confirm('确定清除所有打卡记录？'))return;checkinData={china:{},world:{},worldSub:{}};saveData();refreshAll();showToast('已重置');}

// ==================== TOAST ====================
let toastTimer=null;
function showToast(msg){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;top:50px;left:50%;transform:translateX(-50%);background:#1e293b;color:#e2e8f0;padding:8px 18px;border-radius:20px;z-index:200;font-size:.82rem;border:1px solid #334155;pointer-events:none;transition:opacity .3s';document.body.appendChild(el)}
  el.textContent=msg;el.style.opacity='1';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.opacity='0'},1800);
}

init();
</script>
</body>
</html>
